name: charades
description: "A charades party game app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sensors_plus: ^6.0.0
  proximity_sensor: ^1.0.2
  shared_preferences: ^2.3.0
  uuid: ^4.4.0
  wakelock_plus: ^1.2.0
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
